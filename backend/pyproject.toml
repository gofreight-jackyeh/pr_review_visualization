[project]
name = "pr-explorer"
version = "0.1.0"
description = "PR Review Explorer backend (local-first)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]

[project.scripts]
pr-explorer = "pr_explorer.interface.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/fixtures"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
